 <!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Televisão Smart</title>

    <script>
        class TelevisaoSmart {
            constructor() {
                this.canalAtual = 1;
                this.volume = 10;
                this.ligada = false;
            }

            ligar() {
                this.ligada = true;
                console.log("A TV foi ligada.");
            }

            desligar() {
                this.ligada = false;
                console.log("A TV foi desligada.");
            }

            aumentarVolume() {
                if (!this.ligada) {
                    console.log("A TV está desligada! Ligue-a primeiro.");
                    return;
                }

                if (this.volume < 100) {
                    this.volume++;
                    console.log(`Volume: ${this.volume}`);
                } else {
                    console.log("Volume máximo atingido.");
                }
            }

            diminuirVolume() {
                if (!this.ligada) {
                    console.log("A TV está desligada! Ligue-a primeiro.");
                    return;
                }

                if (this.volume > 0) {
                    this.volume--;
                    console.log(`Volume: ${this.volume}`);
                } else {
                    console.log("Volume mínimo atingido.");
                }
            }

            mudarCanal(novoCanal) {
                if (!this.ligada) {
                    console.log("A TV está desligada! Ligue-a primeiro.");
                    return;
                }

                this.canalAtual = novoCanal;
                console.log(`Canal atual: ${this.canalAtual}`);
            }
        }

        const tv = new TelevisaoSmart();

        tv.aumentarVolume();

        tv.ligar();

        tv.aumentarVolume();
        tv.aumentarVolume();

        tv.mudarCanal(10);

        tv.diminuirVolume();

        tv.desligar();

        tv.mudarCanal(5);
    </script>
</head>

<body>
</body>
</html>
